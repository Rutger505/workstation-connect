# ~/.config/workstation-connect/config.toml

# Phone's Bluetooth address: bluetoothctl devices
phone = "AA:BB:CC:DD:EE:FF"
# NetworkManager connection for the phone's Wi-Fi hotspot (nmcli -f NAME,TYPE connection show), required
hotspot_connection = "Pixel 9 hotspot"
# Seconds without internet before the phone is asked while a saved Wi-Fi is in range (none: at once)
offline_secs = 15
# Saved Wi-Fi never worth leaving the phone for
ignore_ssids = ["WiFi in de trein"]
# KDE Connect device id or name of the phone (default: first paired smartphone)
# kdeconnect_device = "Pixel 9"
# Menu for `wsconnect menu` (default: walker/fuzzel/wofi/rofi, first found)
# menu = ["fuzzel", "--dmenu"]
# Folder for files/photos shared from the phone (applied by `wsconnect setup`)
# share_dir = "~/Pictures/Phone"
