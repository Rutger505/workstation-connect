[package]
name = "workstation-connect"
version = "0.1.0" # unused: the shown version is v<n> from build.rs
edition = "2024"
default-run = "workstation-connect"
description = "Laptop side of workstation-connect: phone hotspot on demand over Bluetooth"
license = "MIT"

[dependencies]
anyhow = "1"
bluer = { version = "0.17", features = ["bluetoothd", "l2cap", "rfcomm"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
