[package]
name = "wsconnect"
version = "0.1.0"
edition = "2024"
description = "Laptop side of workstation-connect: phone hotspot on demand over Bluetooth"
license = "MIT"

[dependencies]
anyhow = "1"
bluer = { version = "0.17", features = ["bluetoothd", "l2cap", "rfcomm"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
